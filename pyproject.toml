[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "imap-mcp"
version = "0.1.0"
description = "A strictly read-only IMAP MCP server."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp==1.28.1",
]

[project.scripts]
imap-mcp = "imap_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/imap_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
