name: Release
on:
  push:
    tags: ['v*']
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: {contents: write, packages: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
          ruff check .
          mypy
          pytest
          python tests/integration/smoke.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish verified images
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          docker buildx build --platform linux/amd64 --push --metadata-file /tmp/mail-image.json --tag "$image:$VERSION" .
          docker buildx build --platform linux/amd64 --push --metadata-file /tmp/login-image.json --tag "$image-keycloak:$VERSION" -f deploy/Keycloak.Dockerfile .
          export MAIL_IMAGE_BASE="$image"
          python - <<'PY'
          import json, os
          from pathlib import Path
          base = os.environ['MAIL_IMAGE_BASE']
          images = {
              'mail': base+'@'+json.loads(Path('/tmp/mail-image.json').read_text())['containerimage.digest'],
              'keycloak': base+'-keycloak@'+json.loads(Path('/tmp/login-image.json').read_text())['containerimage.digest'],
          }
          Path('release-images.json').write_text(json.dumps(images, indent=2))
          PY
          # New GHCR packages may default to private. Never ship unusable image references.
          anonymous_config="$(mktemp -d)"
          if DOCKER_CONFIG="$anonymous_config" docker pull "$(python -c 'import json; print(json.load(open("release-images.json"))["mail"])')" && \
             DOCKER_CONFIG="$anonymous_config" docker pull "$(python -c 'import json; print(json.load(open("release-images.json"))["keycloak"])')"; then
            python scripts/package_release.py --output release --images release-images.json
          else
            echo '::warning::Images are not publicly pullable; shipping the source-build installer.'
            python scripts/package_release.py --output release
          fi
      - name: Create pre-release download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" release/kays-mail-mcp.tar.gz release/SHA256SUMS --prerelease --title "$VERSION" --notes-file docs/release-notes.md
